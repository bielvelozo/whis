[project]
name = "whis"
version = "0.1.0"
description = "Agente pessoal local: diário, daily, jornal e busca, com um vault Obsidian como memória durável."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pystray>=0.19.5",          # ícone na bandeja do Windows
    "Pillow>=10.0",             # imagem do ícone da bandeja
    "httpx>=0.27",              # chamadas HTTP (Linear, Slack, feeds do jornal)
    "claude-agent-sdk>=0.1.0",  # o Claude da conta do usuário (OAuth)
    "mcp>=2.0",                 # o MCP oficial da Granola (reuniões), com OAuth
    "slack_sdk>=3.27",          # a DM do agente por Socket Mode (sem porta aberta)
    "pywin32>=306",             # RegisterHotKey e o loop de mensagens do atalho da palheta
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
whis = "whis.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
whis = ["*.ps1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m \"not rede\""
markers = [
    "rede: teste que fala com um serviço externo real (Claude, Linear, Slack); nao roda por padrao",
]
