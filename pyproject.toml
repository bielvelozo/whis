[project]
name = "whis"
version = "0.1.0"
description = "Coletor de reunião sob demanda: grava, transcreve, resume e escreve no vault Obsidian."
requires-python = ">=3.12,<3.13"
dependencies = [
    "PyAudioWPatch>=0.2.12.7",  # captura WASAPI (mic + loopback)
    "pystray>=0.19.5",          # ícone na bandeja do Windows
    "Pillow>=10.0",             # imagem do ícone da bandeja
    "httpx>=0.27",              # chamadas HTTP (Deepgram batch)
    "claude-agent-sdk>=0.1.0",  # resumo via conta Claude do usuário (OAuth)
    "slack_sdk>=3.27",          # a DM do agente por Socket Mode (sem porta aberta)
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
whis = "whis.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
whis = ["*.ps1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m \"not rede\""
markers = [
    "rede: teste que fala com um serviço externo real (Deepgram/Claude); nao roda por padrao",
]
