<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sonda do banco</title>
<style>
body{margin:0;background:#f7f4ee;color:#17171a;font:16px/1.5 system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
.esquema{color:#17171a;background:#efe9dc;padding:10px;margin:12px 0}
.esquema svg{width:100%;height:auto}
button{min-height:44px;padding:0 18px;border-radius:22px;border:1px solid #5b3fb5;background:#f7f4ee;font:600 15px system-ui}
pre{white-space:pre-wrap;background:#fff;border:1px solid #d3ccbc;padding:8px;font-size:13px}
</style>
</head>
<body>
<main>
<h1>Sonda do banco — VERSAO_DA_PAGINA</h1>
<p>Rascunho descartável do Whis. Testa o banco da página e um esquema SVG inline.</p>
<figure class="esquema">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180">
<defs><marker id="seta" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="currentColor"/></marker></defs>
<rect x="120" y="50" width="80" height="80" rx="6" fill="none" stroke="currentColor" stroke-width="2"/>
<line x1="160" y1="90" x2="160" y2="20" stroke="#5b3fb5" stroke-width="2" marker-end="url(#seta)"/>
<line x1="160" y1="90" x2="215" y2="30" stroke="#8a5a2b" stroke-width="2" marker-end="url(#seta)"/>
<text x="150" y="16" text-anchor="end" font-size="12" fill="#5b3fb5">para onde a roda aponta</text>
<text x="222" y="40" font-size="12" fill="#8a5a2b">para onde ela vai</text>
<text x="160" y="160" text-anchor="middle" font-size="13">slip angle = o ângulo entre as duas</text>
</svg>
</figure>
<button id="gravar" type="button">Gravar leitura sonda-1</button>
<pre id="log"></pre>
</main>
<script>
const log = (t) => { document.getElementById("log").textContent += t + "\n"; };
(async () => {
  log("window.claude: " + typeof window.claude);
  let db = null;
  try {
    db = window.claude ? await window.claude.use("db") : null;
    log("use(db): " + (db ? "ok" : "null"));
  } catch (e) {
    log("use(db) rejeitou: " + (e && e.code) + " " + (e && e.message));
  }
  if (db) {
    try {
      const d = await db.doc("leituras/sonda-1").get();
      log("get: exists=" + d.exists + " " + JSON.stringify(d.exists ? d.data() : null));
    } catch (e) {
      log("get rejeitou: " + (e && e.code) + " " + (e && e.message));
    }
  }
  document.getElementById("gravar").addEventListener("click", async () => {
    if (!db) { log("sem db"); return; }
    try {
      await db.doc("leituras/sonda-1").set({ lida: true, em: new Date().toISOString() });
      log("set ok");
    } catch (e) {
      log("set rejeitou: " + (e && e.code) + " " + (e && e.message));
    }
  });
})();
</script>
</body>
</html>
